<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151c">
  <meta name="description" content="Eaglercraft 1.21.6 browser client development build">
  <title>Eaglercraft 1.21.6 — Development</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">E</span><div><strong>Eaglercraft</strong><small>1.21.6 · Development build</small></div></div>
      <span class="status" id="runtime-status">Initializing browser runtime…</span>
    </header>
    <section class="viewport" aria-label="Renderer test viewport">
      <canvas id="game-canvas" aria-label="WebGL2 renderer test canvas"></canvas>
      <div class="notice" id="engine-notice">
        <div class="notice-icon" aria-hidden="true">◆</div>
        <h1>WebGL2 renderer test</h1>
        <p>A rotating test cube verifies the browser graphics pipeline. This is not Minecraft gameplay.</p>
        <p class="muted">Minecraft Java 1.21.6 engine integration is still pending.</p>
      </div>
    </section>
    <footer>
      <span id="graphics-status">Graphics: checking…</span>
      <span id="input-status">Input: ready</span>
      <a href="https://github.com/UserArham/Eaglercraft-1.21.6" target="_blank" rel="noreferrer">Source repository</a>
    </footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
